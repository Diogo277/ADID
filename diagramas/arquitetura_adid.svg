<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #0f5ea8; }
      .subtitle { font: 600 20px Arial, sans-serif; fill: #1f2937; }
      .label { font: 600 17px Arial, sans-serif; fill: #111827; }
      .small { font: 500 14px Arial, sans-serif; fill: #374151; }
      .group { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 14; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 12; }
      .boxA { fill: #eef6ff; }
      .boxB { fill: #ecfdf3; }
      .boxC { fill: #fff7ed; }
      .arrow { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .lineText { font: 600 13px Arial, sans-serif; fill: #334155; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
    </marker>
  </defs>

  <text x="60" y="60" class="title">ADID - Arquitetura do Sistema (Versao Atual)</text>
  <text x="60" y="95" class="small">Execucao local no navegador Chrome (sem backend ativo no repositorio atual)</text>

  <rect x="60" y="130" width="620" height="590" class="group" />
  <text x="80" y="165" class="subtitle">Extensao Chrome (MV3)</text>

  <rect x="130" y="230" width="220" height="120" class="box boxA" />
  <text x="152" y="268" class="label">Usuario</text>
  <text x="152" y="295" class="small">Interage com o popup</text>

  <rect x="430" y="210" width="210" height="155" class="box boxA" />
  <text x="455" y="250" class="label">popup.html</text>
  <text x="455" y="274" class="small">popup.js</text>
  <text x="455" y="302" class="small">Seleciona modo</text>
  <text x="455" y="322" class="small">Envia adapt/reset</text>

  <rect x="370" y="455" width="280" height="170" class="box boxA" />
  <text x="395" y="495" class="label">content_script.js</text>
  <text x="395" y="522" class="small">Varredura do DOM</text>
  <text x="395" y="544" class="small">Heuristicas de cor</text>
  <text x="395" y="566" class="small">Badges e legenda</text>
  <text x="395" y="588" class="small">Reset dos estilos</text>

  <rect x="760" y="130" width="580" height="590" class="group" />
  <text x="780" y="165" class="subtitle">Pagina Web Ativa</text>

  <rect x="840" y="220" width="420" height="120" class="box boxB" />
  <text x="860" y="258" class="label">DOM visivel</text>
  <text x="860" y="286" class="small">Elementos com texto/fundo/borda</text>

  <rect x="840" y="395" width="420" height="130" class="box boxC" />
  <text x="860" y="433" class="label">Sinalizacao visual</text>
  <text x="860" y="461" class="small">Badges R/G (red-green)</text>
  <text x="860" y="483" class="small">Badges B/Y (tritanopia)</text>

  <rect x="840" y="575" width="420" height="110" class="box boxB" />
  <text x="860" y="612" class="label">Memoria local (coresOriginais)</text>
  <text x="860" y="640" class="small">Permite restaurar no reset</text>

  <path d="M 350 290 L 430 290" class="arrow" />
  <text x="360" y="280" class="lineText">clique e modo</text>

  <path d="M 535 365 L 510 455" class="arrow" />
  <text x="545" y="418" class="lineText">adapt/reset</text>

  <path d="M 650 530 L 840 280" class="arrow" />
  <text x="700" y="420" class="lineText">analisa elementos</text>

  <path d="M 650 560 L 840 460" class="arrow" />
  <text x="705" y="505" class="lineText">marca badges</text>

  <path d="M 650 605 L 840 625" class="arrow" />
  <text x="700" y="645" class="lineText">salva e restaura estilo</text>
</svg>
