<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #0f5ea8; }
      .small { font: 500 15px Arial, sans-serif; fill: #374151; }
      .step { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 12; }
      .decision { fill: #fff7ed; stroke: #9a3412; stroke-width: 2; }
      .ok { fill: #ecfdf3; stroke: #166534; stroke-width: 2; rx: 12; }
      .no { fill: #fef2f2; stroke: #991b1b; stroke-width: 2; rx: 12; }
      .text { font: 600 18px Arial, sans-serif; fill: #111827; }
      .sub { font: 500 14px Arial, sans-serif; fill: #4b5563; }
      .arrow { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .tag { font: 700 14px Arial, sans-serif; fill: #334155; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
    </marker>
  </defs>

  <text x="70" y="70" class="title">ADID - Fluxo de Funcionamento</text>
  <text x="70" y="102" class="small">Adaptacao local de cores + sinalizacao visual + reset</text>

  <rect x="360" y="150" width="480" height="92" class="step" />
  <text x="390" y="188" class="text">1) Usuario abre popup e escolhe modo</text>
  <text x="390" y="214" class="sub">red-green (deuteranopia/protanopia) ou tritanopia</text>

  <rect x="390" y="300" width="420" height="80" class="step" />
  <text x="415" y="347" class="text">2) Clique em Adaptar</text>

  <rect x="360" y="440" width="480" height="96" class="step" />
  <text x="390" y="478" class="text">3) content_script varre body *</text>
  <text x="390" y="504" class="sub">Filtra apenas elementos visiveis</text>

  <polygon points="600,610 820,730 600,850 380,730" class="decision" />
  <text x="492" y="724" class="text">4) Elemento possui</text>
  <text x="465" y="748" class="text">cor problematica no modo?</text>

  <rect x="80" y="915" width="340" height="95" class="no" />
  <text x="125" y="956" class="text">Nao: ignora elemento</text>
  <text x="125" y="983" class="sub">segue para o proximo</text>

  <rect x="520" y="920" width="600" height="120" class="ok" />
  <text x="550" y="960" class="text">Sim: salva estilo original e identifica elemento</text>
  <text x="550" y="986" class="sub">Aplica badge R/G ou B/Y conforme o modo</text>
  <text x="550" y="1010" class="sub">Atualiza legenda na pagina</text>

  <rect x="440" y="1105" width="540" height="100" class="step" />
  <text x="470" y="1145" class="text">5) Atualizacao dinamica dos badges</text>
  <text x="470" y="1172" class="sub">scroll, resize, mousemove e mutacoes do DOM</text>

  <rect x="450" y="1270" width="520" height="92" class="step" />
  <text x="480" y="1310" class="text">6) Usuario clica Reset</text>
  <text x="480" y="1336" class="sub">remove badges/legenda e restaura estilos</text>

  <rect x="430" y="1435" width="560" height="95" class="ok" />
  <text x="458" y="1476" class="text">Resultado: pagina volta ao estado original</text>
  <text x="458" y="1502" class="sub">Processo pode ser executado novamente</text>

  <path d="M 600 242 L 600 300" class="arrow" />
  <path d="M 600 380 L 600 440" class="arrow" />
  <path d="M 600 536 L 600 610" class="arrow" />

  <path d="M 380 730 L 250 730 L 250 915" class="arrow" />
  <text x="285" y="748" class="tag">NAO</text>

  <path d="M 820 730 L 930 730 L 930 920" class="arrow" />
  <text x="870" y="748" class="tag">SIM</text>

  <path d="M 250 1010 L 250 1060 L 710 1060 L 710 1105" class="arrow" />
  <path d="M 820 1040 L 820 1105" class="arrow" />

  <path d="M 710 1205 L 710 1270" class="arrow" />
  <path d="M 710 1362 L 710 1435" class="arrow" />
</svg>
