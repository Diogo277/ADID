<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ADID</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',Arial,sans-serif;width:300px;background:#f8f9fa;color:#212529}

    .header{background:#1a1a2e;padding:12px 16px;display:flex;align-items:center;gap:10px}
    .header img{width:36px;height:36px;object-fit:contain;border-radius:6px}
    .header-text h1{font-size:16px;font-weight:700;color:#fff;letter-spacing:.5px}
    .header-text p{font-size:11px;color:#adb5bd;margin-top:1px}

    .tabs{display:flex;background:#e9ecef;border-bottom:2px solid #dee2e6}
    .tab{flex:1;padding:8px 2px;border:none;background:transparent;font-size:11px;font-weight:600;
         color:#6c757d;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;
         transition:all .18s}
    .tab.active{color:#0d6efd;background:#f8f9fa;border-bottom-color:#0d6efd}
    .tab:hover:not(.active){background:#dee2e6}

    .content{padding:14px 16px}
    .mode-desc{font-size:11px;color:#6c757d;line-height:1.5;margin-bottom:12px}
    .mode-desc strong{color:#343a40}

    .legend{display:flex;gap:14px;margin-bottom:14px;flex-wrap:wrap}
    .legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:#495057}
    .badge-demo{width:16px;height:16px;display:flex;align-items:center;justify-content:center;
                color:#fff;font-size:9px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.25)}

    .btn{display:block;width:100%;padding:10px;border:none;border-radius:8px;font-size:13px;
         font-weight:600;cursor:pointer;transition:all .18s;margin-bottom:8px}
    .btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
    .btn:active{transform:none}
    .btn-rg{background:#198754;color:#fff}
    .btn-t{background:#0d6efd;color:#fff}
    .btn-reset{background:#fff;color:#6c757d;border:1px solid #dee2e6;font-size:12px}
    .btn-reset:hover{background:#f8d7da;color:#dc3545;border-color:#dc3545}

    .hint{font-size:10px;color:#adb5bd;margin-top:10px;text-align:center}
    .hint a{color:#0d6efd;text-decoration:none}
  </style>
</head>
<body>
  <div class="header">
    <img src="images/logotipo.png" alt="ADID">
    <div class="header-text">
      <h1>ADID</h1>
      <p>Acessibilidade Digital para Indivíduos Daltônicos</p>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-mode="red-green">Vermelho-Verde</button>
    <button class="tab"        data-mode="tritanopia">Azul-Amarelo</button>
  </div>

  <div class="content">
    <p class="mode-desc" id="mode-desc"></p>
    <div class="legend" id="legend"></div>
    <button class="btn" id="adapt"></button>
    <button class="btn btn-reset" id="reset">↩ Resetar cores</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
